<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Diferencia entre pérdidas irreparables y daños restaurables">
<defs><radialGradient id="pdG" cx=".5" cy=".5"><stop offset="0" stop-color="#00B4D8" stop-opacity=".18"/><stop offset="1" stop-color="#00B4D8" stop-opacity="0"/></radialGradient></defs>
<ellipse cx="200" cy="130" rx="180" ry="118" fill="url(#pdG)"/>
<g>
  <text x="104" y="46" font-family="monospace" font-size="13" fill="#FF6B6B" text-anchor="middle">PÉRDIDAS</text>
  <circle cx="104" cy="132" r="52" fill="#FF6B6B" fill-opacity=".1" stroke="#FF6B6B" stroke-width="2"/>
  <g stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"><path d="M84 112 l40 40 M124 112 l-40 40"/></g>
  <text x="104" y="212" font-family="monospace" font-size="11" fill="#D4E6F1" text-anchor="middle" opacity=".7">ya no se recuperan</text>
</g>
<path d="M200 60 V208" stroke="#D4E6F1" stroke-width="1" opacity=".18"/>
<g>
  <text x="296" y="46" font-family="monospace" font-size="13" fill="#2ab377" text-anchor="middle">DAÑOS</text>
  <circle cx="296" cy="132" r="52" fill="#2ab377" fill-opacity=".1" stroke="#2ab377" stroke-width="2"/>
  <g stroke="#5fe0a5" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M276 134 l14 16 28 -34"><animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/></path>
  </g>
  <text x="296" y="212" font-family="monospace" font-size="11" fill="#D4E6F1" text-anchor="middle" opacity=".7">admiten restauración</text>
</g>
<text x="200" y="246" font-family="monospace" font-size="11" fill="#00F5FF" text-anchor="middle">saber cuál es cuál define qué se hace</text>
</svg>
